<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lendas do Vôlei 3D</title>
<style>
:root{--cyan:#41e6ff;--pink:#ff4ca3;--dark:#090d1b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--dark);font-family:system-ui,Arial;color:#fff;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:12px;gap:8px}
.panel{background:linear-gradient(135deg,#101a32eF,#1a1234eF);border:1px solid #4be8ff66;border-radius:14px;padding:9px 13px;box-shadow:0 0 22px #23d8ff18;backdrop-filter:blur(6px)}
.brand{font-size:clamp(13px,3vw,20px);font-weight:900;letter-spacing:.5px;color:var(--cyan)}.sub{font-size:10px;color:#b6c9e8}
.score{display:flex;gap:16px;align-items:center;font-weight:900;font-size:clamp(20px,5vw,30px)}.score span:last-child{color:var(--pink)}.score small{font-size:10px;display:block;color:#b9c6df;text-align:center}
#message{position:absolute;top:24%;left:50%;transform:translateX(-50%);font-weight:900;text-align:center;font-size:clamp(17px,4vw,28px);text-shadow:0 3px 15px #000;white-space:nowrap}
.bottom{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 12px;gap:8px}
.controls{display:grid;grid-template-columns:repeat(3,minmax(47px,66px));gap:6px;pointer-events:auto}
.actions{display:grid;grid-template-columns:repeat(2,minmax(62px,88px));gap:6px;pointer-events:auto}
button{border:1px solid #6eeeff99;border-radius:14px;background:#101c35dd;color:white;font-weight:800;font-size:12px;min-height:48px;padding:8px;box-shadow:0 4px 0 #050914;touch-action:none}
button:active,button.active{background:#147b9c;transform:translateY(2px);box-shadow:0 2px 0 #050914}
button.action{border-color:#ff70b9aa;background:#35132ddd}button.action:active{background:#a52e75}
#hint{position:absolute;bottom:132px;left:50%;transform:translateX(-50%);font-size:11px;color:#d2e5ff;text-align:center;background:#071020b8;padding:6px 10px;border-radius:10px;white-space:nowrap}
@media(min-width:800px){.controls{grid-template-columns:repeat(3,70px)}.actions{grid-template-columns:repeat(2,95px)}button{font-size:13px;min-height:54px}}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud">
 <div class="top">
  <div class="panel"><div class="brand">🏐 LENDAS DO VÔLEI</div><div class="sub">PROTÓTIPO 3D • estilo anime</div></div>
  <div class="panel score"><div><small>VOCÊ</small><span id="ps">0</span></div><div style="color:#8ba4c8">:</div><div><small>CPU</small><span id="cs">0</span></div></div>
  <div class="panel"><div id="level" style="font-weight:900">LV. 1</div><div class="sub">XP <span id="xp">0</span>/100</div></div>
 </div>
 <div id="message">TOQUE EM SACAR</div>
 <div id="hint">Mover: WASD / setas • Pular: Espaço • Ataque: F • Bloqueio: G</div>
 <div class="bottom">
  <div class="controls">
   <button data-key="left">◀</button><button data-key="up">▲ PULAR</button><button data-key="right">▶</button>
   <button data-key="down" style="grid-column:2">▼</button>
  </div>
  <div class="actions">
   <button class="action" id="serve">SACAR</button><button class="action" id="spike">ATAQUE</button>
   <button id="block">BLOQUEIO</button><button id="dive">MERGULHO</button>
  </div>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
const root=document.getElementById('game'), msg=document.getElementById('message');
if(!window.THREE){msg.textContent='Conecte à internet para carregar o 3D';return}
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x090d1b); scene.fog=new THREE.Fog(0x090d1b,22,55);
const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,.1,100); camera.position.set(0,9,16); camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9bdfff,0x15132b,2));
const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(-5,12,8);light.castShadow=true;scene.add(light);
function mat(color,rough=.7,emissive=0){return new THREE.MeshStandardMaterial({color,roughness:rough,emissive,emissiveIntensity:.25})}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),mat(0x10172b));floor.rotation.x=-Math.PI/2;floor.position.y=-.15;floor.receiveShadow=true;scene.add(floor);
const court=new THREE.Mesh(new THREE.BoxGeometry(12,.18,22),mat(0x126f9b));court.position.set(0,0,0);court.receiveShadow=true;scene.add(court);
const courtTop=new THREE.Mesh(new THREE.PlaneGeometry(11.6,21.6),mat(0x164b7a));courtTop.rotation.x=-Math.PI/2;courtTop.position.y=.1;scene.add(courtTop);
function line(x1,z1,x2,z2,color=0xd9faff,y=.205){let dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz);let m=new THREE.Mesh(new THREE.BoxGeometry(.055,.025,len),mat(color, .4, color));m.position.set((x1+x2)/2,y,(z1+z2)/2);m.rotation.y=Math.atan2(dx,dz);scene.add(m)}
line(-5.6,-10.6,5.6,-10.6);line(-5.6,10.6,5.6,10.6);line(-5.6,-10.6,-5.6,10.6);line(5.6,-10.6,5.6,10.6);line(-5.6,0,5.6,0,0xffe4fb);
line(-5.6,-6,5.6,-6);line(-5.6,6,5.6,6);
const netMat=mat(0xeafaff);const net=new THREE.Mesh(new THREE.BoxGeometry(12,.08,.1),mat(0xffffff));net.position.set(0,2.6,0);scene.add(net);
for(let x=-5.5;x<=5.51;x+=.32){let v=new THREE.Mesh(new THREE.BoxGeometry(.025,1.3,.035),mat(0xa7e9ff));v.position.set(x,1.95,0);scene.add(v)}
for(let y=1.35;y<=2.55;y+=.24){let h=new THREE.Mesh(new THREE.BoxGeometry(11.5,.025,.035),mat(0xa7e9ff));h.position.set(0,y,0);scene.add(h)}
for(const x of [-5.9,5.9]){let p=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,3.2,10),mat(0xf5fbff));p.position.set(x,1.6,0);scene.add(p)}
function makePlayer(color,skin,number){const g=new THREE.Group();const shirt=new THREE.Mesh(new THREE.CylinderGeometry(.38,.48,.9,12),mat(color));shirt.position.y=1.45;g.add(shirt);
const head=new THREE.Mesh(new THREE.SphereGeometry(.28,16,12),mat(skin));head.position.y=2.12;g.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.29,12,8),mat(0x151728));hair.scale.set(1.05,.55,1);hair.position.set(0,2.3,0);g.add(hair);
for(const side of [-1,1]){const arm=new THREE.Mesh(new THREE.CylinderGeometry(.09,.12,.72,8),mat(skin));arm.position.set(side*.48,1.52,0);arm.rotation.z=side*-.22;g.add(arm);const leg=new THREE.Mesh(new THREE.CylinderGeometry(.13,.16,.7,8),mat(0x11192b));leg.position.set(side*.2,.55,0);g.add(leg)}
const glow=new THREE.Mesh(new THREE.RingGeometry(.48,.55,24),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.7,side:THREE.DoubleSide}));glow.rotation.x=-Math.PI/2;glow.position.y=.22;g.add(glow);
g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return g}
const player=makePlayer(0x32dcff,0xf2bd96),cpu=makePlayer(0xff4b91,0xe0a77d);player.position.set(0,0,6.5);cpu.position.set(0,0,-6.5);scene.add(player,cpu);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.3,24,18),mat(0xfff4d2,.35,0xff9a28));ball.castShadow=true;scene.add(ball);
for(let i=0;i<3;i++){const stripe=new THREE.Mesh(new THREE.TorusGeometry(.302,.025,6,32),mat(i===1?0x1d8fff:0xff683b));stripe.rotation.y=i*1.05;ball.add(stripe)}
let keys={},scoreP=0,scoreC=0,xp=0,level=1,vy=0,bvx=0,bvy=0,bvz=0,air=false,serveReady=true,hitCooldown=0,blockTimer=0,diveTimer=0,gameTime=0;
const ballStart=()=>{ball.position.set(0,3,5.3);bvx=0;bvy=0;bvz=0;vy=0;air=false;serveReady=true;msg.textContent='TOQUE EM SACAR'};
ballStart();
function updateScore(who){if(who==='p'){scoreP++;xp+=25;msg.textContent='PONTO SEU! +25 XP'}else{scoreC++;msg.textContent='PONTO DA CPU'}if(xp>=100){xp-=100;level++;document.getElementById('level').textContent='LV. '+level;msg.textContent+=' • SUBIU DE NÍVEL!'}document.getElementById('ps').textContent=scoreP;document.getElementById('cs').textContent=scoreC;document.getElementById('xp').textContent=xp;setTimeout(ballStart,900)}
function jump(){if(player.position.y<.05){vy=.19;air=true}}
function serve(){if(!serveReady)return;serveReady=false;ball.position.set(player.position.x,player.position.y+2.6,player.position.z-0.4);bvx=(Math.random()-.5)*.055;bvy=.15;bvz=-.24;msg.textContent='SAQUE!'}
function spike(){if(Math.abs(ball.position.x-player.position.x)<2.4&&Math.abs(ball.position.z-player.position.z)<4.2&&ball.position.y>1){bvx=(ball.position.x-player.position.x)*.09;bvy=-.02;bvz=-.38;msg.textContent='ATAQUE POTENTE!';xp+=5;document.getElementById('xp').textContent=xp}}
function block(){blockTimer=.45;if(Math.abs(ball.position.z)<2.1&&ball.position.z<player.position.z){bvy=.15;bvz=.28;msg.textContent='BLOQUEIO!'}}
function dive(){diveTimer=.45;player.position.x=Math.max(-5,Math.min(5,player.position.x+(ball.position.x-player.position.x)*.35));if(Math.abs(ball.position.x-player.position.x)<2.3&&Math.abs(ball.position.z-player.position.z)<3){bvy=.12;bvz=-.23;msg.textContent='DEFESA!'}}
function act(k){if(k==='left')keys.left=true;if(k==='right')keys.right=true;if(k==='up')jump();if(k==='down')keys.down=true}
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();b.classList.add('active');if(k==='up')jump();else keys[k]=true};const up=e=>{e.preventDefault();b.classList.remove('active');keys[k]=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
document.getElementById('serve').addEventListener('pointerdown',e=>{e.preventDefault();serve()});document.getElementById('spike').addEventListener('pointerdown',e=>{e.preventDefault();spike()});document.getElementById('block').addEventListener('pointerdown',e=>{e.preventDefault();block()});document.getElementById('dive').addEventListener('pointerdown',e=>{e.preventDefault();dive()});
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k==='a'||k==='arrowleft')keys.left=true;if(k==='d'||k==='arrowright')keys.right=true;if(k==='w'||k==='arrowup'||k===' ')jump();if(k==='s'||k==='arrowdown')keys.down=true;if(k==='f')spike();if(k==='g')block();if(k==='e')serve();if(k==='shift')dive()});
addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')keys.left=false;if(k==='d'||k==='arrowright')keys.right=false;if(k==='s'||k==='arrowdown')keys.down=false});
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.035);gameTime+=dt;hitCooldown=Math.max(0,hitCooldown-dt);blockTimer=Math.max(0,blockTimer-dt);diveTimer=Math.max(0,diveTimer-dt);
let speed=5.2*dt;if(keys.left)player.position.x-=speed;if(keys.right)player.position.x+=speed;if(keys.down)player.position.z+=speed;if(keys.up)jump();player.position.x=THREE.MathUtils.clamp(player.position.x,-5.1,5.1);player.position.z=THREE.MathUtils.clamp(player.position.z,1,10);
if(player.position.y>0||vy>0){player.position.y+=vy*dt*5;vy-=.65*dt;if(player.position.y<=0){player.position.y=0;vy=0;air=false}}
player.rotation.z=keys.left?.12:keys.right?-.12:0;
cpu.position.x+=THREE.MathUtils.clamp(ball.position.x-cpu.position.x,-dt*3,dt*3);cpu.position.x=THREE.MathUtils.clamp(cpu.position.x,-4.8,4.8);
if(!serveReady){ball.position.x+=bvx;ball.position.y+=bvy;ball.position.z+=bvz;bvy-=.42*dt;
 if(Math.abs(ball.position.z)<.3&&ball.position.y<3&&Math.abs(ball.position.x)<5.8&&Math.random()<.02){bvx*=-.7;bvz*=-.65}
 if(ball.position.y<.3){if(ball.position.z>0)updateScore('c');else updateScore('p')}
 if(ball.position.z<-10.5)updateScore('p');if(ball.position.z>10.5)updateScore('c');
 if(Math.abs(ball.position.x)>6) {bvx*=-.8;ball.position.x=Math.sign(ball.position.x)*5.7}
 // CPU returns the ball occasionally when it reaches its side
 if(ball.position.z< -3&&ball.position.z>-7&&ball.position.y<2.5&&Math.abs(ball.position.x-cpu.position.x)<1.5&&hitCooldown<=0){bvx=(player.position.x-ball.position.x)*.025;bvy=.16;bvz=.25;hitCooldown=.8;msg.textContent='A CPU DEVOLVEU!'}
}
ball.rotation.x+=dt*2;ball.rotation.z+=dt*1.3;
camera.position.x+=(player.position.x*.22-camera.position.x)*dt*2;camera.lookAt(player.position.x*.12,1.1,0);
renderer.render(scene,camera)}
const clock=new THREE.Clock();animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script>
</body>
</html>
